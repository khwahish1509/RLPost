[project]
name = "memory-stream"
version = "0.1.0"
description = "Conversational memory environment: a Scribe maintains a capped notebook across multi-session dialogues; reward is Lift — how much the notebook improves a frozen reader on questions about earlier sessions."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_stream"]
