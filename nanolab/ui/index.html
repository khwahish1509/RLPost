<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nanolab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' font-family='Georgia,serif'%3En%3C/text%3E%3C/svg%3E">
<!-- Newsreader loads from Google Fonts when online; Georgia carries it offline -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="shell">
  <header class="masthead">
    <a class="word" href="#/bench">nanolab</a>
    <div class="strip" id="strip"></div>
    <div class="mast-right">
      <span class="rec" id="rec" style="display:none"><span class="dot"></span>RECORDING</span>
      <a class="paper-link" href="#/paper" data-route="paper">READ THE PAPER</a>
    </div>
  </header>
  <div class="body">
    <aside class="sidebar">
      <div class="rooms-label">ROOMS</div>
      <nav>
        <a href="#/bench" data-route="bench">The Bench</a>
        <a href="#/environments" data-route="environments">Environments</a>
        <a href="#/evals" data-route="evals">Evals</a>
        <a href="#/training" data-route="training">Training</a>
        <a href="#/agent" data-route="agent">Memory Agent</a>
        <a href="#/artifacts" data-route="artifacts">Artifacts</a>
        <a href="#/console" data-route="console">Console</a>
      </nav>
      <div class="sidebar-footer" id="side-foot"></div>
    </aside>
    <main id="page"></main>
  </div>
</div>

<div id="drawer-veil" onclick="closeDrawer()"></div>
<aside id="drawer" aria-label="receipts">
  <div class="d-head">
    <div class="d-kicker" id="d-kicker">RECEIPTS</div>
    <div class="d-title" id="d-title"></div>
    <button class="d-close" onclick="closeDrawer()">ESC ✕</button>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>

<div id="modal-veil"><div id="modal"></div></div>
<div id="toast"></div>
<script src="/assets/app.js"></script>
</body>
</html>
