<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nanolab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B0C0E'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' font-family='monospace' fill='%23B7F542'%3En%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="word" href="#/home">nano<span>lab</span></a>
    <nav>
      <a href="#/home" data-route="home">Home</a>
      <a href="#/tasks" data-route="tasks">Tasks</a>
      <a href="#/train" data-route="train">Train</a>
      <a href="#/evals" data-route="evals">Evals</a>
      <a href="#/memory" data-route="memory">Memory</a>
      <a href="#/models" data-route="models">Models</a>
      <div class="nav-sep"></div>
      <a href="#/findings" data-route="findings">Findings</a>
    </nav>
    <div class="sidebar-footer" id="side-foot"></div>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <div class="strip" id="strip"></div>
      <div class="top-right">
        <span class="rec" id="rec" style="display:none"><span class="dot"></span>TRAINING</span>
        <button class="term-toggle" id="term-btn" title="Console (ctrl+`)" onclick="toggleConsole()">&gt;_</button>
      </div>
    </header>
    <main id="page"></main>
  </div>
</div>

<div id="console-panel">
  <div class="cp-head">
    <span class="cp-title mono">&gt;_ CONSOLE</span>
    <span class="helper" style="margin:0">Read-only nanolab commands — click one or type. Nothing here can change data.</span>
    <button class="d-close" style="position:static; margin-left:auto" onclick="toggleConsole()">ESC ✕</button>
  </div>
  <div id="console-inner"></div>
</div>

<div id="drawer-veil" onclick="closeDrawer()"></div>
<aside id="drawer" aria-label="receipts">
  <div class="d-head">
    <div class="d-kicker" id="d-kicker">RECEIPTS</div>
    <div class="d-title" id="d-title"></div>
    <button class="d-close" onclick="closeDrawer()">ESC ✕</button>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>

<div id="modal-veil"><div id="modal"></div></div>
<div id="toast"></div>
<script src="/assets/app.js"></script>
</body>
</html>
